<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp - 4</title>
    <style>
        
    </style>
</head>
<body>
    <form style="text-align: center; " action="#" method="post">
        <h1 align="center">Hotel Room Booking Form</h1>
        <label for="name"><b>Full Name:</b></label>
        <input type="text" id="name">
        <br>
        <br>
        <label for="email"><b>Email:</b></label>
        <input type="email" id="email">
        <br>
        <br>
        <label for="phone"><b>Phone:</b></label>
        <input type="tel" id="phone">
        <br>
        <br>
        <label for="check_indate"><b>Check in:</b></label>
        <input type="date" id="check_indate">
        <br>
        <br>
        <label for="check_outdate"><b>Check out:</b></label>
        <input type="date" id="check_outdate">
        <br>
        <br>
        <label for="room_type"><b>Room Type:</b></label>
        <select type="" id="room_type">
            <option value="single_room">Single room</option>
            <option value="double_room">Double room</option>
            <option value="triple_room">Triple room</option>
        </select>
        <br>
        <br>
        <label for="guest"><b>No of guest:</b></label>
        <input type="number" id="guest">
        <br>
        <br>
        <label for="message"><b>Special Requests:</b></label>
        <br>
        <textarea></textarea>
        <br>
        <input type="submit">
    </form>
</body>
</html>
